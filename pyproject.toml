[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faeco-rseco"
version = "0.1.0"
description = "Failure-aware resynthesis-assisted timing ECO research prototype"
requires-python = ">=3.11"
authors = [
  { name = "FAECO Project" }
]

[tool.setuptools.packages.find]
where = ["code/src"]

[tool.pytest.ini_options]
pythonpath = ["code/src"]
testpaths = ["code/tests"]
